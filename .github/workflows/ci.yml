name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest      # the engine has to run on plain Linux
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --extra stream
      - run: .venv/bin/python -m pytest tests/stream
